<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifky Galvaleri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class = "hero">
        <audio id="backgroundSound" src="sound.mp3" preload="auto" autoplay loop></audio>
        <video autoplay loop muted playsinline class="back-video">
            <source src="video.mov"/>
        </video>
        <section class="content">
            <h1>Rifky Galvaleri,<br>will you be my boyfriend?</h1>
            <div class="buttons">
                <a href="privacy.html" id="yesbutton">Yes</a>
                <a href="#" id="nobutton" onmouseover="movebutton()" onclick="movebutton()">No</a>
            </div>
        </section>
    </section>

    <footer style="position: fixed; bottom: 10px; width: 100%; text-align: center; color: white; font-size: 14px; opacity: 0.7;">
    From <strong>Yassu</strong> ❤️
    </footer>


    <script>
        const noBtn = document.getElementById("nobutton");
        
        // Get parent container dimensions
        const parent = document.querySelector(".buttons");
        
        // movement range (in px, moderate)
        const offset = 120;  
        
        function movebutton() {
            const parentRect = parent.getBoundingClientRect();
            const randX = Math.random() * offset * 2 - offset; 
            const randY = Math.random() * offset * 2 - offset;
            const parentCenterX = parentRect.width / 2;
            const parentCenterY = parentRect.height / 2;
            noBtn.style.position = "absolute";
            noBtn.style.left = `${parentCenterX + randX}px`;
            noBtn.style.top = `${parentCenterY + randY}px`;
        }

        document.body.addEventListener("click", () => {
        const audio = document.getElementById("backgroundSound");
        audio.muted = false; // unmute after user clicks anywhere
        audio.play();
    });
    </script>
</body>
</html>
