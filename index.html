<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifky Galvaleri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class = "hero">
        <audio id="backgroundSound" src="sound.mp3" preload="auto" autoplay loop></audio>
        <video autoplay loop muted playsinline class="back-video">
            <source src="video.mov"/>
        </video>
        <section class="content">
            <h1>Rifky Galvaleri,<br>will you be my boyfriend?</h1>
            <div class="buttons">
                <a href="privacy.html" id="yesbutton">Yes</a>
                <a href="#" id="nobutton" onmouseover="movebutton()" onclick="movebutton()">No</a>
            </div>
        </section>
    </section>

    <footer style="position: fixed; bottom: 10px; width: 100%; text-align: center; color: white; font-size: 14px; opacity: 0.7;">
    From <strong>Yassu</strong> ❤️
    </footer>


    <script>
        // Save original position when page loads
        let baseX = null, baseY = null;
        
        window.onload = () => {
          const noBtn = document.getElementById('nobutton');
          const rect = noBtn.getBoundingClientRect();
          baseX = rect.left;
          baseY = rect.top;
        };
        
        function movebutton() {
          const noBtn = document.getElementById('nobutton');
        
          // movement range in px (tweak these to make it more/less wild)
          const rangeX = 150;  
          const rangeY = 120;  
        
          // random offset from original position
          const offsetX = (Math.random() - 0.5) * 2 * rangeX;
          const offsetY = (Math.random() - 0.5) * 2 * rangeY;
        
          noBtn.style.position = "absolute";
          noBtn.style.left = `${baseX + offsetX}px`;
          noBtn.style.top = `${baseY + offsetY}px`;
        }

        document.body.addEventListener("click", () => {
        const audio = document.getElementById("backgroundSound");
        audio.muted = false; // unmute after user clicks anywhere
        audio.play();
    });
    </script>
</body>
</html>
