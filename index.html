<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifky Galvaleri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class = "hero">
        <audio id="backgroundSound" src="sound.mp3" preload="auto" autoplay loop></audio>
        <video autoplay loop muted playsinline class="back-video">
            <source src="video.mov"/>
        </video>
        <section class="content">
            <h1>Rifky Galvaleri,<br>will you be my boyfriend?</h1>
            <div class="buttons">
                <a href="privacy.html" id="yesbutton">Yes</a>
                <a href="#" id="nobutton" onmouseover="movebutton()" onclick="movebutton()">No</a>
            </div>
        </section>
    </section>

    <footer style="position: fixed; bottom: 10px; width: 100%; text-align: center; color: white; font-size: 14px; opacity: 0.7;">
    From <strong>Yassu</strong> ❤️
    </footer>


    <script>
        function movebutton() {
            const noBtn = document.getElementById('nobutton');
            // safe area boundaries (avoid going completely off screen)
            const padding = 80; // how far from edges
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
        
            // random new position
            const x = Math.random() * maxX + padding / 2;
            const y = Math.random() * maxY + padding / 2;
        
            noBtn.style.position = "absolute";
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }
        
        document.body.addEventListener("click", () => {
        const audio = document.getElementById("backgroundSound");
        audio.muted = false; // unmute after user clicks anywhere
        audio.play();
    });
    </script>
</body>
</html>
